<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Name - 3D Auth</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap");

      body {
        font-family: "Poppins", sans-serif;
        margin: 0;
        overflow: hidden; /* Hide scrollbars for the 3D canvas */
        background-color: #1a1a2e;
        color: #fff;
      }

      /* 3D Background Container */
      #canvas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        background: linear-gradient(-45deg, #0f172a, #3b0764, #0f172a, #172554);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
      }
      @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* UI Overlay */
      #ui-layer {
        position: relative;
        z-index: 10;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        pointer-events: none; /* Let clicks pass through to canvas if needed, but we re-enable for form */
      }

      /* 3D Flip Card Logic */
      .card-3d-wrap {
        position: relative;
        width: 440px;
        max-width: 90%;
        height: 550px; /* Fixed height for the flip effect */
        perspective: 1200px; /* Essential for 3D effect */
        pointer-events: auto; /* Re-enable pointer events for the form */
      }

      .card-3d-wrapper {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* Bouncy transition */
      }

      /* Class to trigger the flip */
      .card-3d-wrapper.show-signup {
        transform: rotateY(180deg);
      }

      .card-front,
      .card-back {
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.05);
        background-image: url("https://s3-us-west-2.amazonaws.com/s.cdpn.io/1462889/pat.svg");
        background-position: bottom center;
        background-repeat: no-repeat;
        background-size: 300%;
        position: absolute;
        border-radius: 16px;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        backface-visibility: hidden; /* Hide the back when flipped */
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px); /* Glassmorphism */
        -webkit-backdrop-filter: blur(10px);
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .card-back {
        transform: rotateY(180deg);
      }

      /* Form Elements Styling */
      .input-group {
        position: relative;
        width: 100%;
        margin-bottom: 20px;
      }

      .input-icon {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        left: 15px;
        color: #ffeba7;
        font-size: 18px;
        transition: 0.3s;
      }

      .input-group input {
        width: 100%;
        background-color: rgba(31, 32, 41, 0.6);
        border: 1px solid transparent;
        padding: 12px 15px 12px 45px; /* Space for icon */
        border-radius: 8px;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
        transition: 0.3s;
        outline: none;
      }

      .input-group input:focus {
        border-color: #ffeba7;
        background-color: rgba(31, 32, 41, 0.8);
        box-shadow: 0 0 10px rgba(255, 235, 167, 0.2);
      }

      .input-group input::placeholder {
        color: #c4c3ca;
      }

      .btn-submit {
        width: 100%;
        background-color: #ffeba7;
        color: #102770;
        border: none;
        padding: 13px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
        box-shadow: 0 8px 24px 0 rgba(255, 235, 167, 0.2);
      }

      .btn-submit:hover {
        background-color: #fff;
        color: #102770;
        transform: translateY(-2px);
        box-shadow: 0 12px 30px 0 rgba(255, 235, 167, 0.4);
      }

      .switch-btn {
        background: transparent;
        border: none;
        color: #ffeba7;
        cursor: pointer;
        font-size: 14px;
        text-decoration: underline;
        margin-top: 20px;
        transition: 0.3s;
      }

      .switch-btn:hover {
        color: #fff;
      }

      .brand-logo {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 30px;
        color: #ffeba7;
        text-shadow: 0 0 10px rgba(255, 235, 167, 0.3);
      }


    </style>
  </head>
  <body>
    <!-- Background for Three.js -->
    <div id="canvas-container"></div>

    <!-- Foreground UI -->
    <div id="ui-layer">
      <div class="card-3d-wrap">
        <div class="card-3d-wrapper" id="cardWrapper">
          <!-- Front: Login -->
          <div class="card-front">
            <div class="brand-logo">Website Name</div>
            <h4 class="text-xl font-bold mb-6 text-white tracking-wide">
              Log In
            </h4>

            <form id="login-form" class="w-full">
              <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  placeholder="Your Email"
                  value="demo@websitename.com"
                  required
                />
              </div>
              <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  placeholder="Your Password"
                  value="password123"
                  required
                />
              </div>
              <button type="submit" class="btn-submit">Log In</button>

              <div class="text-center mt-3">
                <a
                  href="#"
                  class="text-xs text-gray-400 hover:text-white transition-colors"
                  >Forgot Password?</a
                >
              </div>
            </form>

            <button class="switch-btn" id="toSignupBtn">
              New here? Create an Account
              <i class="fas fa-arrow-right ml-1"></i>
            </button>
          </div>

          <!-- Back: Sign Up -->
          <div class="card-back">
            <div class="brand-logo">Website Name</div>
            <h4 class="text-xl font-bold mb-6 text-white tracking-wide">
              Sign Up
            </h4>

            <form id="signup-form" class="w-full">
              <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" placeholder="Full Name" required />
              </div>
              <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" placeholder="Your Email" required />
              </div>
              <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" placeholder="Set Password" required />
              </div>
              <button type="submit" class="btn-submit">Register</button>
            </form>

            <button class="switch-btn" id="toLoginBtn">
              <i class="fas fa-arrow-left mr-1"></i> Back to Log In
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Popup -->
    <div id="modal-popup" class="hidden fixed inset-0 z-[200] flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 opacity-0 pointer-events-auto">
      <div class="bg-[#1f2029] p-8 rounded-2xl shadow-2xl border border-[rgba(255,255,255,0.1)] text-center max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="modal-content">
        <div class="text-[#ffeba7] text-5xl mb-4" id="modal-icon"><i class="fas fa-check-circle"></i></div>
        <h3 class="text-2xl font-bold text-white mb-2" id="modal-title">Success</h3>
        <p class="text-gray-300 mb-6" id="modal-message">Message</p>
        <button class="bg-[#ffeba7] text-[#102770] font-bold py-2 px-8 rounded-lg hover:bg-white transition-colors shadow-[0_8px_24px_rgba(255,235,167,0.2)] hover:shadow-[0_12px_30px_rgba(255,235,167,0.4)] hover:-translate-y-1 transform duration-300" onclick="closeModal()">OK</button>
      </div>
    </div>

    <script>
      // --- UI Logic (The 3D Flip) ---
      const cardWrapper = document.getElementById("cardWrapper");
      const toSignupBtn = document.getElementById("toSignupBtn");
      const toLoginBtn = document.getElementById("toLoginBtn");

      toSignupBtn.addEventListener("click", () => {
        cardWrapper.classList.add("show-signup");
      });

      toLoginBtn.addEventListener("click", () => {
        cardWrapper.classList.remove("show-signup");
      });

      // --- Modal Popup Logic ---
      const modalPopup = document.getElementById("modal-popup");
      const modalContent = document.getElementById("modal-content");
      const modalTitle = document.getElementById("modal-title");
      const modalMessage = document.getElementById("modal-message");

      function showModal(title, message) {
        modalTitle.innerText = title;
        modalMessage.innerText = message;
        modalPopup.classList.remove("hidden");
        // Trigger reflow
        void modalPopup.offsetWidth;
        modalPopup.classList.remove("opacity-0");
        modalContent.classList.remove("scale-95");
        modalContent.classList.add("scale-100");
      }

      function closeModal() {
        modalPopup.classList.add("opacity-0");
        modalContent.classList.remove("scale-100");
        modalContent.classList.add("scale-95");
        setTimeout(() => {
          modalPopup.classList.add("hidden");
        }, 300);
      }

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const btn = e.target.querySelector("button");
        const originalText = btn.innerText;
        btn.innerText = "Verifying...";
        setTimeout(() => {
          btn.innerText = originalText;
          showModal("Success!", "log in");
        }, 1000);
      });

      document.getElementById("signup-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const btn = e.target.querySelector("button");
        const originalText = btn.innerText;
        btn.innerText = "Creating...";
        setTimeout(() => {
          btn.innerText = originalText;
          showModal("Success!", "account created");
          cardWrapper.classList.remove("show-signup");
        }, 1000);
      });

      // --- Three.js Background Animation ---

      let scene, camera, renderer;
      let particles = [];
      let geometricShapes = [];

      function initThreeJS() {
        const container = document.getElementById("canvas-container");

        // 1. Scene Setup
        scene = new THREE.Scene();
        // Fog to blend items into the background distance
        scene.fog = new THREE.FogExp2(0x0f172a, 0.002);

        // 2. Camera Setup
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.z = 50;

        // 3. Renderer Setup
        renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 4. Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 20);
        scene.add(directionalLight);

        const pointLight1 = new THREE.PointLight(0x8b5cf6, 4, 100); // Purple light
        pointLight1.position.set(20, 10, 20);
        scene.add(pointLight1);
        
        const pointLight2 = new THREE.PointLight(0x06b6d4, 4, 100); // Cyan light
        pointLight2.position.set(-20, -10, 20);
        scene.add(pointLight2);

        // 5. Add Objects (Geometric Shapes)

        // Main floating TorusKnot (smooth, glowing style)
        const geometry = new THREE.TorusKnotGeometry(12, 3.5, 128, 16);
        const material = new THREE.MeshPhysicalMaterial({
          color: 0xffeba7,
          metalness: 0.2,
          roughness: 0.1,
          transmission: 0.9, // glass effect
          transparent: true,
          opacity: 0.8,
        });
        const mainShape = new THREE.Mesh(geometry, material);
        scene.add(mainShape);
        geometricShapes.push(mainShape);

        // Scattered Glowing Spheres
        const sphereGeometry = new THREE.SphereGeometry(1.2, 32, 32);
        const sphereMaterial = new THREE.MeshPhysicalMaterial({ 
          color: 0xffffff,
          metalness: 0.5,
          roughness: 0.2,
          transmission: 0.5,
          transparent: true,
        });

        for (let i = 0; i < 60; i++) {
          const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);

          // Random positions
          sphere.position.x = (Math.random() - 0.5) * 120;
          sphere.position.y = (Math.random() - 0.5) * 120;
          sphere.position.z = (Math.random() - 0.5) * 80 - 20;

          // Random rotation speed property
          sphere.rotationSpeed = {
            x: Math.random() * 0.02,
            y: Math.random() * 0.02,
          };

          scene.add(sphere);
          particles.push(sphere);
        }

        // 6. Handle Resize
        window.addEventListener("resize", onWindowResize, false);

        // 7. Mouse Interaction
        document.addEventListener("mousemove", onDocumentMouseMove, false);
      }

      let mouseX = 0;
      let mouseY = 0;
      let targetX = 0;
      let targetY = 0;

      const windowHalfX = window.innerWidth / 2;
      const windowHalfY = window.innerHeight / 2;

      function onDocumentMouseMove(event) {
        mouseX = event.clientX - windowHalfX;
        mouseY = event.clientY - windowHalfY;
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        requestAnimationFrame(animate);

        targetX = mouseX * 0.001;
        targetY = mouseY * 0.001;

        // Rotate main shape
        if (geometricShapes.length > 0) {
          geometricShapes[0].rotation.y += 0.005;
          geometricShapes[0].rotation.x += 0.002;

          // Subtle parralax based on mouse
          geometricShapes[0].rotation.y +=
            0.05 * (targetX - geometricShapes[0].rotation.y);
          geometricShapes[0].rotation.x +=
            0.05 * (targetY - geometricShapes[0].rotation.x);
        }

        // Animate particles
        particles.forEach((p) => {
          p.rotation.x += p.rotationSpeed.x;
          p.rotation.y += p.rotationSpeed.y;

          // Gentle floating movement
          p.position.y += Math.sin(Date.now() * 0.001 + p.position.x) * 0.05;
        });

        renderer.render(scene, camera);
      }

      // Start everything
      initThreeJS();
      animate();
    </script>
  </body>
</html>
